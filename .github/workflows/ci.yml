name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: khophe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-database.sh
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khophe_test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci > "$RUNNER_TEMP/npm-install.log" 2>&1; then
            cat "$RUNNER_TEMP/npm-install.log"
            node -e "const fs=require('node:fs');const text=fs.readFileSync(process.env.RUNNER_TEMP+'/npm-install.log','utf8').split('\n').slice(0,35).join('\n');console.log('::error::'+text.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));"
            exit 1
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
